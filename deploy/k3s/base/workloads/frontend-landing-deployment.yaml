apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-landing
  labels:
    app: frontend-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-landing
  template:
    metadata:
      labels:
        app: frontend-landing
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: frontend-landing
          image: ghcr.io/nestlancer/frontend-landing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9020
              name: http
          envFrom:
            - secretRef:
                name: nestlancer-frontend-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "9020"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
